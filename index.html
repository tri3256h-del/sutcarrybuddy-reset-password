<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ตั้งรหัสผ่านใหม่ — SUT CarryBuddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#FFF8EF; --card:#FFFFFF; --border:#E8D5C4; --text:#3A2113;
    --muted:#8B7E74; --primary:#FF7A30; --primary-deep:#E86A22;
    --danger:#E74C3C; --good:#2ECC71;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Sarabun',sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .wrap{ width:100%; max-width:400px; }
  .header{ text-align:center; margin-bottom:24px; }
  .logo{
    width:64px; height:64px; border-radius:18px; margin:0 auto 14px;
    background:linear-gradient(150deg, var(--primary), var(--primary-deep));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 22px -10px rgba(255,122,48,.55);
  }
  .logo svg{ width:30px; height:30px; }
  h1{ font-family:'Kanit',sans-serif; font-size:22px; font-weight:700; margin:0 0 4px; }
  .sub{ font-size:13.5px; color:var(--muted); margin:0; line-height:1.5; }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:26px 24px; box-shadow:0 20px 40px -28px rgba(58,33,19,.25);
  }
  label{ display:block; font-size:13px; font-weight:600; margin:0 0 8px; }
  label:not(:first-child){ margin-top:16px; }
  .field{
    display:flex; align-items:center; background:#FFF1E3; border-radius:12px;
    border:1.5px solid transparent; transition:border-color .15s;
  }
  .field:focus-within{ border-color:var(--primary); }
  input{
    flex:1; border:none; background:transparent; outline:none;
    padding:13px 14px; font-size:14.5px; color:var(--text); font-family:inherit;
    min-width:0;
  }
  .eye{
    background:none; border:none; cursor:pointer; padding:10px 12px;
    color:var(--muted); display:flex; align-items:center; justify-content:center;
  }
  .submit{
    width:100%; margin-top:22px; padding:14px; border:none; border-radius:12px;
    background:var(--primary); color:#fff; font-family:'Sarabun',sans-serif;
    font-size:15.5px; font-weight:600; cursor:pointer; transition:background .15s, opacity .15s;
  }
  .submit:hover{ background:var(--primary-deep); }
  .submit:disabled{ opacity:.55; cursor:not-allowed; }
  .msg{
    display:none; font-size:13px; border-radius:10px; padding:11px 13px; margin-top:14px;
    line-height:1.5;
  }
  .msg.show{ display:block; }
  .msg.error{ background:#FDECEC; color:var(--danger); }
  .msg.info{ background:#FFF3E0; color:#9A5B12; }
  .success-view{ display:none; text-align:center; }
  .success-view.show{ display:block; }
  .success-icon{
    width:56px; height:56px; border-radius:50%; background:#E6F7ED; color:var(--good);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
  }
  .success-view h2{ font-family:'Kanit',sans-serif; font-size:18px; margin:0 0 8px; }
  .success-view p{ font-size:13.5px; color:var(--muted); margin:0; line-height:1.6; }
  .form-view.hide{ display:none; }
  footer{ text-align:center; margin-top:20px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 6.5 12 11l9-4.5M12 11v11" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <h1>ตั้งรหัสผ่านใหม่</h1>
      <p class="sub" id="subText">กำลังตรวจสอบลิงก์ของคุณ...</p>
    </div>

    <div class="card">
      <div class="form-view" id="formView">
        <label for="pw1">รหัสผ่านใหม่</label>
        <div class="field">
          <input id="pw1" type="password" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password" />
          <button type="button" class="eye" id="eyeBtn" aria-label="แสดง/ซ่อนรหัสผ่าน">
            <!-- ไอคอนตาปิด (eye-off) -->
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8B7E74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <label for="pw2">ยืนยันรหัสผ่านใหม่</label>
        <div class="field">
          <input id="pw2" type="password" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" autocomplete="new-password" />
        </div>

        <button class="submit" id="submitBtn" disabled>กำลังตรวจสอบลิงก์...</button>
        <div class="msg" id="msgBox"></div>
      </div>

      <div class="success-view" id="successView">
        <div class="success-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2>ตั้งรหัสผ่านใหม่สำเร็จ</h2>
        <p>กลับไปที่แอป SUT CarryBuddy แล้วเข้าสู่ระบบด้วยรหัสผ่านใหม่ ปิดหน้านี้ได้เลย</p>
      </div>
    </div>

    <footer>SUT CarryBuddy</footer>
  </div>

<script>
  const SUPABASE_URL = 'https://uuumnuxkncdrkuqsghvb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1dW1udXhrbmNkcmt1cXNnaHZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODIyNzQsImV4cCI6MjA5OTM1ODI3NH0.D9aJENgxvAEU2UTx19NYKGCIGXmMvYq4bOXx6gSaXYA';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const subText = document.getElementById('subText');
  const formView = document.getElementById('formView');
  const successView = document.getElementById('successView');
  const submitBtn = document.getElementById('submitBtn');
  const msgBox = document.getElementById('msgBox');
  const pw1 = document.getElementById('pw1');
  const pw2 = document.getElementById('pw2');
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');

  // SVG Paths สำหรับสลับไอคอน
  const eyeOpenPath = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
  const eyeOffPath = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

  eyeBtn.addEventListener('click', () => {
    const showing = pw1.type === 'text';
    pw1.type = showing ? 'password' : 'text';
    pw2.type = showing ? 'password' : 'text';
    
    // สลับ SVG
    eyeIcon.innerHTML = showing ? eyeOffPath : eyeOpenPath;
  });

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = 'msg show ' + type;
  }

  async function init() {
    // 1. เช็ก PKCE Flow (?code=...)
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    if (code) {
      const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
      if (error) {
        subText.textContent = 'ลิงก์นี้ใช้ไม่ได้แล้ว';
        showMsg(error.message + ' — กรุณากลับไปกดขอลิงก์ใหม่ในแอป', 'error');
        submitBtn.textContent = 'ลิงก์หมดอายุ';
        return;
      }
      subText.textContent = 'กรอกรหัสผ่านใหม่ที่ต้องการใช้เข้าสู่ระบบ';
      submitBtn.textContent = 'บันทึกรหัสผ่านใหม่';
      submitBtn.disabled = false;
      return;
    }

    // 2. เช็ก Implicit Flow (#access_token=...)
    const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
    const hashParams = new URLSearchParams(hash);
    const accessToken = hashParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token');
    const errorDesc = hashParams.get('error_description');

    if (errorDesc) {
      subText.textContent = 'ลิงก์นี้ใช้ไม่ได้แล้ว';
      showMsg(decodeURIComponent(errorDesc.replace(/\+/g, ' ')) + ' — กรุณากลับไปกดขอลิงก์ใหม่ในแอป', 'error');
      submitBtn.textContent = 'ลิงก์หมดอายุ';
      return;
    }

    if (accessToken && refreshToken) {
      const { error } = await supabaseClient.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken,
      });

      if (error) {
        subText.textContent = 'ลิงก์นี้ใช้ไม่ได้แล้ว';
        showMsg(error.message + ' — กรุณากลับไปกดขอลิงก์ใหม่ในแอป', 'error');
        submitBtn.textContent = 'ลิงก์หมดอายุ';
        return;
      }

      subText.textContent = 'กรอกรหัสผ่านใหม่ที่ต้องการใช้เข้าสู่ระบบ';
      submitBtn.textContent = 'บันทึกรหัสผ่านใหม่';
      submitBtn.disabled = false;
      return;
    }

    // 3. เช็กว่ามี Session อยู่แล้วหรือไม่
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      subText.textContent = 'กรอกรหัสผ่านใหม่ที่ต้องการใช้เข้าสู่ระบบ';
      submitBtn.textContent = 'บันทึกรหัสผ่านใหม่';
      submitBtn.disabled = false;
      return;
    }

    subText.textContent = 'ไม่พบข้อมูลลิงก์ที่ถูกต้อง';
    showMsg('กรุณาเปิดหน้านี้จากลิงก์ในอีเมลที่ได้รับจากแอปเท่านั้น', 'error');
    submitBtn.textContent = 'ลิงก์ไม่ถูกต้อง';
  }

  submitBtn.addEventListener('click', async () => {
    const p1 = pw1.value;
    const p2 = pw2.value;

    if (!p1 || !p2) {
      showMsg('กรุณากรอกรหัสผ่านให้ครบทั้งสองช่อง', 'error');
      return;
    }
    if (p1.length < 6) {
      showMsg('รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
      return;
    }
    if (p1 !== p2) {
      showMsg('รหัสผ่านไม่ตรงกัน กรุณากรอกให้เหมือนกันทั้งสองช่อง', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังบันทึก...';

    const { error } = await supabaseClient.auth.updateUser({ password: p1 });

    if (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'บันทึกรหัสผ่านใหม่';
      showMsg(error.message, 'error');
      return;
    }

    await supabaseClient.auth.signOut();
    formView.classList.add('hide');
    successView.classList.add('show');
  });

  init();
</script>
</body>
</html>
